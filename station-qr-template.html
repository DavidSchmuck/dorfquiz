<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Station QR-Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    :root {
      --bg: #f5f8f2;
      --white: #ffffff;
      --green-dark: #2e6b3e;
      --green: #3d8c52;
      --green-light: #e6f2e9;
      --border: #cce0d1;
      --text: #2a3a2d;
      --text-mid: #4e6b54;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .poster {
      background: var(--white);
      border: 2px solid var(--border);
      border-radius: 20px;
      max-width: 760px;
      width: 100%;
      min-height: 980px;
      padding: 32px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(46,107,62,.12);
    }
    .badge {
      display: inline-block;
      background: var(--green-light);
      color: var(--green-dark);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 36px;
      color: var(--green-dark);
      text-align: center;
      line-height: 1.2;
    }
    .subtitle {
      color: var(--text-mid);
      font-size: 20px;
      margin-bottom: 18px;
      text-align: center;
    }
    .qr-wrap {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin: 10px 0 20px;
    }
    canvas {
      display: block;
      width: 420px !important;
      height: 420px !important;
      max-width: 100%;
      border-radius: 12px;
    }
    .url {
      margin-top: 18px;
      max-width: 700px;
      width: 100%;
      text-align: center;
      font-size: 15px;
      color: var(--text-mid);
      word-break: break-all;
      line-height: 1.5;
    }
    @media (max-width: 700px) {
      .poster { min-height: auto; padding: 24px 16px; }
      h1 { font-size: 28px; }
      .subtitle { font-size: 17px; }
      canvas { width: 260px !important; height: 260px !important; }
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="badge">Dorfquiz Ammerndorf</div>
    <h1 id="station-title">Station</h1>
    <div class="subtitle" id="station-subtitle">Scanne den QR-Code, um zur Station zu gelangen.</div>
    <div class="qr-wrap">
      <canvas id="qr-canvas"></canvas>
    </div>
    <div class="url" id="qr-url"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const stationNumber = parseInt(params.get('station')) || 1;
    const stationKeys = ['dreschhaus','kirchturm','kaerwabaum','bahnhofsplatz','marktplatz','muehle','feuerwehr','rathaus','buergerhaus'];
    const stationTitles = [
      'Station 1',
      'Das Dreschmaschinenhaus',
      'Die Sankt Peter und Paul Kirche',
      'Der Bahnhofsplatz',
      'Der Marktplatz',
      'Die Ammerndorfer Mühle',
      'Die Freiwillige Feuerwehr Ammerndorf',
      'Das Rathaus',
      'Das Bürgerhaus'
    ];

    const stationKey = stationKeys[stationNumber - 1] || stationKeys[0];
    const targetUrl = `https://davidschmuck.github.io/index%20-%20Stationen%20nur%20mit%20QR%20Code%20m%C3%B6glich.html?station=${stationNumber}&key=${stationKey}`;

    document.getElementById('station-title').textContent = stationTitles[stationNumber - 1] || 'Dorfquiz';
    document.getElementById('station-subtitle').textContent = 'Scanne den QR-Code, um direkt zu diesem Ort zu gelangen.';
    document.getElementById('qr-url').textContent = targetUrl;

    new QRious({
      element: document.getElementById('qr-canvas'),
      value: targetUrl,
      size: 420,
      background: '#ffffff',
      foreground: '#2e6b3e',
      level: 'M'
    });
  </script>
</body>
</html>
